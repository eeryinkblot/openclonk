name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GTEST_VERSION: "1.10.0"

jobs:
  headless:
    name: Headless — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Record the platform
        run: |
          uname -sm
          cmake --version | head -1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpng-dev libjpeg-dev libfreetype-dev zlib1g-dev \
            libcurl4-openssl-dev libminiupnpc-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # Deliberately no libepoxy: HEADLESS_ONLY must not need a GL loader.
        run: brew install libpng jpeg-turbo freetype miniupnpc

      # CMake compiles gtest/gmock into the project, so it needs their sources.
      # A packaged googletest only ships headers and libraries and will not do.
      # The version is pinned from both ends: the tests use the arity-based
      # MOCK_METHOD1/2 macros dropped in later releases, and the project is
      # CMAKE_CXX_STANDARD 14 with STANDARD_REQUIRED ON, which rules out 1.15+.
      - name: Fetch googletest sources
        run: |
          curl -sSL -o gtest.tar.gz \
            "https://github.com/google/googletest/archive/refs/tags/release-${GTEST_VERSION}.tar.gz"
          tar xzf gtest.tar.gz

      - name: Configure
        run: |
          GT="$PWD/googletest-release-${GTEST_VERSION}"
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHEADLESS_ONLY=ON \
            -DGTEST_ROOT="$GT/googletest" -DGMOCK_ROOT="$GT/googlemock" . \
            | tee configure.log
          if grep -q "Could NOT find GTest" configure.log; then
            echo "::error::googletest sources were not picked up"
            exit 1
          fi

      # `-j` with no number means unlimited parallelism to GNU Make: ~500
      # translation units spawn as many compilers, the runner runs out of
      # memory and is shut down mid-build. Bound it to the core count.
      - name: Build
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)
          echo "building with $jobs jobs"
          cmake --build build --parallel "$jobs"

      - name: Build test targets
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)
          cmake --build build --target tests aul_test StdMeshMath --parallel "$jobs"

      # Asserting the property directly rather than relying on libepoxy being
      # absent from the runner: HEADLESS_ONLY claims to skip the graphics
      # dependencies, so nothing in the server may pull in a GL loader.
      - name: Assert the headless build needs no GL loader
        run: |
          hits=$(grep -rl "epoxy" build/CMakeFiles/openclonk-server.dir \
                   --include="*.o.d" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::openclonk-server still depends on epoxy:"
            echo "$hits"
            exit 1
          fi
          echo "no GL loader in the headless server"

      # The manifest lives in build/tests, not build: enable_testing() is called
      # from tests/CMakeLists.txt rather than the top level. Assert the three
      # binaries are actually registered before trusting the result -- a target
      # added without add_test() drops out of the suite silently, which is
      # exactly what used to happen to `tests` itself.
      - name: Unit tests
        run: |
          listing=$(ctest --test-dir build/tests -N)
          echo "$listing"
          for t in tests aul_test StdMeshMath; do
            echo "$listing" | grep -qE "Test +#[0-9]+: $t\$" \
              || { echo "::error::$t is not registered with ctest"; exit 1; }
          done
          ctest --test-dir build/tests --output-on-failure

      - name: Pack game data
        run: cmake --build build --target groups

      # c4group exits 0 even when packing fails, so the build reports success
      # while writing zero-byte archives. Check the output, not the exit code.
      - name: Reject empty group files
        run: |
          status=0
          for f in build/*.oc*; do
            if [ -s "$f" ]; then
              printf '  %10d  %s\n' "$(wc -c < "$f")" "$f"
            else
              echo "::error::$f is empty — packing failed silently"
              status=1
            fi
          done
          exit $status

      # C4Reloc::Init() looks for a `planet` folder next to the executable and
      # only falls back to OC_SYSTEM_DATA_DIR -- the install prefix -- if there
      # is none. That fallback is why an uninstalled out-of-source build fails
      # with "Error opening system group file (System.ocg)!" on Linux; upstream
      # never hit it because Travis built in-source, putting the binaries in the
      # repository root next to planet/. Point the engine at the packed groups
      # instead of the unpacked sources, so the scenario run exercises what
      # c4group produced. The lookup is #ifndef __APPLE__, so this is a no-op on
      # macOS, where SystemDataPath is the executable's own directory.
      - name: Stage packed game data next to the binary
        run: |
          mkdir -p build/planet
          for f in build/*.oc*; do
            ln -sf "../$(basename "$f")" "build/planet/$(basename "$f")"
          done
          ls -l build/planet

      # stdin must stay open. C4StdInProc::Execute() treats a failed read as a
      # shutdown request -- that is how the engine is meant to be stopped, and
      # what tests/start_all_scenarios.rs relies on -- but a `run:` step gets
      # stdin from /dev/null, so the read fails immediately and the engine
      # quits before the state machine reaches its first PreInit. It leaves no
      # trace beyond "Game cleared", which looks like a clean run. `tail -f`
      # holds the pipe open without ever sending anything.
      - name: Run a scenario
        run: |
          tail -f /dev/null | ./build/openclonk-server --language=US \
            "$PWD/planet/Tests.ocf/Movement.ocs" Test.ocp > engine.log 2>&1 &
          pid=$!
          sleep 90
          # Terminating has to be forced. Without an stdin EOF to act on, the
          # macOS build does not react to SIGTERM here, and the step then hangs
          # until the job timeout. Also drop the tail: it inherits the step's
          # stdout, and the runner waits for that pipe to close.
          kill $pid 2>/dev/null || true
          sleep 5
          kill -9 $pid 2>/dev/null || true
          pkill -f "tail -f /dev/null" 2>/dev/null || true
          wait $pid 2>/dev/null || true
          cat engine.log
          grep -q "Game started" engine.log \
            || { echo "::error::the engine never started the scenario"; exit 1; }
          grep -Eq "C4AulScriptEngine linked - .*, 0 warnings, 0 errors" engine.log \
            || { echo "::error::script engine reported warnings or errors"; exit 1; }

  macos-app:
    name: macOS app bundle
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install libepoxy openal-soft freealut sdl2 \
            libpng jpeg-turbo freetype libogg libvorbis miniupnpc

      # openal-soft is keg-only. Without the prefix hint FindAudio falls back to
      # Apple's deprecated OpenAL.framework, which has no EFX.
      - name: Configure
        run: |
          cmake -B build-gui -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHEADLESS_ONLY=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix openal-soft)" . | tee configure.log
          grep -q "Using Audio toolkit: OpenAL" configure.log \
            || { echo "::error::no real OpenAL was selected"; exit 1; }

      - name: Build
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)
          cmake --build build-gui --parallel "$jobs"

      # install_name_tool invalidates signatures, and on arm64 an invalid
      # signature is fatal: the kernel refuses to map the image. The bundled
      # libraries must verify.
      - name: Verify bundled libraries are signed
        run: |
          status=0
          for f in build-gui/openclonk.app/Contents/Frameworks/*.dylib; do
            if codesign -v "$f" 2>/dev/null; then
              echo "  ok  $(basename "$f")"
            else
              echo "::error::$(basename "$f") has no valid signature"
              status=1
            fi
          done
          exit $status

      # The whole bundle must verify, resource seal included. That only works
      # because signing happens after the game data is packed in; if the order
      # regresses this is the check that catches it.
      - name: Verify the bundle verifies
        run: |
          codesign -v build-gui/openclonk.app \
            || { echo "::error::the app bundle does not verify"; exit 1; }
          echo "bundle signature and resource seal are valid"

      - name: Verify the executable is fully linked
        run: |
          exe=build-gui/openclonk.app/Contents/MacOS/openclonk
          file "$exe"
          missing=0
          # Feed the loop by redirection, not through a pipe: a piped while
          # runs in a subshell and its assignment to $missing would be lost.
          while read -r lib; do
            path="${lib/@executable_path/$(dirname "$exe")}"
            if [ -f "$path" ]; then
              echo "  ok  $lib"
            else
              echo "::error::unresolved dependency: $lib"
              missing=1
            fi
          done < <(otool -L "$exe" | tail -n +2 | awk '{print $1}' \
                     | grep -v '^/System\|^/usr/lib')
          exit $missing
