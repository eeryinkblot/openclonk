name: Build and test

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only for everything except the release job, which raises it to
# contents: write for itself. The default would otherwise be whatever the
# repository settings say, which is not visible from this file.
permissions:
  contents: read

env:
  GTEST_VERSION: "1.14.0"

# How the jobs are split, since "same product, different shape" is a fair
# question to ask of this file:
#
#   Platform checks   -- build, unit tests, packing, the scenario suite --
#                        run once per platform.
#   Content checks    -- the C4Script lint over planet/ -- run once, anywhere.
#                        The script engine is platform-independent, and the
#                        three platforms agreeing on it is what the scenario
#                        suite already establishes. A second runner would
#                        reprint the same 99 lines.
#   Configuration     -- C4GROUP_TOOL_ONLY -- runs where it can actually fail.
#   checks               On Windows the default target breaks (#19); on Linux
#                        the same configuration succeeds by accident, because
#                        PNG and JPEG headers are in /usr/include whether the
#                        configuration looked for them or not.
#
# ubuntu and macOS share one matrix because they share their steps: 12 of the
# 14 are byte-identical and only the dependency install differs. Windows is its
# own job because none of its steps are the same -- different shell, /MP
# instead of --parallel, ctest needs -C, hardlinks instead of symlinks, and no
# stdin EOF to stop the engine with. Folding it into the matrix would mean an
# `if:` on 12 of 14 steps, which is longer and harder to read than two honest
# jobs.
#
# What must *not* differ is what the platforms assert. The scenario pins live
# in tests/scenario-suite-expected.txt and are read by every job that runs the
# suite.
jobs:
  headless:
    name: Headless — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `platform` is the artifact name, not a second way to say `os`:
        # ubuntu-latest is x86_64 and macos-latest has been arm64 since the
        # macOS 14 image, and a downloader needs to know which.
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64

    steps:
      - uses: actions/checkout@v5

      - name: Record the platform
        run: |
          uname -sm
          cmake --version | head -1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpng-dev libjpeg-dev libfreetype-dev zlib1g-dev \
            libcurl4-openssl-dev libminiupnpc-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # aws/tap ships with the runner image and is untrusted, which makes
        # Homebrew print a warning three times per job. We only ever install
        # from homebrew/core, so drop it rather than let a warning that never
        # matters train everyone to skip warnings. Tolerant of it being absent:
        # the steps run under `bash -e` and untapping something that is not
        # there is an error.
        # Deliberately no libepoxy: HEADLESS_ONLY must not need a GL loader.
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install libpng jpeg-turbo freetype miniupnpc

      # CMake compiles gtest/gmock into the project, so it needs their sources.
      # A packaged googletest only ships headers and libraries and will not do.
      # The lower bound is the toolchain: 1.10.0, which this used to pin, has no
      # #include <cstdint> in gtest-death-test.cc and gtest-port.cc, and GCC 15
      # and later no longer drag it in by accident, so the whole library fails
      # to compile on a current distribution.
      #
      # There is no upper bound any more. It used to be CMAKE_CXX_STANDARD 14,
      # which ruled out 1.15+; the project is on C++17 now, so moving past
      # 1.14.0 is a choice rather than a blocker. Nothing needs it yet, and the
      # three development machines have 1.14.0 unpacked already.
      #
      # The tag naming changed at 1.9: up to 1.10.0 it is release-<v>, from
      # 1.11.0 on it is v<v>, and the extracted directory follows the tag.
      - name: Fetch googletest sources
        run: |
          curl -sSL -o gtest.tar.gz \
            "https://github.com/google/googletest/archive/refs/tags/v${GTEST_VERSION}.tar.gz"
          tar xzf gtest.tar.gz

      - name: Configure
        run: |
          GT="$PWD/googletest-${GTEST_VERSION}"
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHEADLESS_ONLY=ON \
            -DGTEST_ROOT="$GT/googletest" -DGMOCK_ROOT="$GT/googlemock" . \
            | tee configure.log
          if grep -q "Could NOT find GTest" configure.log; then
            echo "::error::googletest sources were not picked up"
            exit 1
          fi

      # `-j` with no number means unlimited parallelism to GNU Make: ~500
      # translation units spawn as many compilers, the runner runs out of
      # memory and is shut down mid-build. Bound it to the core count.
      - name: Build
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)
          echo "building with $jobs jobs"
          cmake --build build --parallel "$jobs"

      - name: Build test targets
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)
          cmake --build build --target tests aul_test StdMeshMath determinism --parallel "$jobs"

      # Asserting the property directly rather than relying on libepoxy being
      # absent from the runner: HEADLESS_ONLY claims to skip the graphics
      # dependencies, so nothing in the server may pull in a GL loader.
      - name: Assert the headless build needs no GL loader
        run: |
          hits=$(grep -rl "epoxy" build/CMakeFiles/openclonk-server.dir \
                   --include="*.o.d" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::openclonk-server still depends on epoxy:"
            echo "$hits"
            exit 1
          fi
          echo "no GL loader in the headless server"

      # The manifest lives in build/tests, not build: enable_testing() is called
      # from tests/CMakeLists.txt rather than the top level. Assert the three
      # binaries are actually registered before trusting the result -- a target
      # added without add_test() drops out of the suite silently, which is
      # exactly what used to happen to `tests` itself.
      - name: Unit tests
        run: |
          listing=$(ctest --test-dir build/tests -N)
          echo "$listing"
          for t in tests aul_test StdMeshMath determinism; do
            echo "$listing" | grep -qE "Test +#[0-9]+: $t\$" \
              || { echo "::error::$t is not registered with ctest"; exit 1; }
          done
          ctest --test-dir build/tests --output-on-failure

      # Packed in parallel on purpose. Two c4group processes in one directory
      # used to pick the same temporary file -- MakeTempFilename() finds the
      # lowest unused <name>.NNN and returns it without claiming it -- which
      # produced an intermittent "Pack failed", by preference on the largest
      # group. 0ce1ea716 fixed it by chaining each group onto the previous one.
      # Packing serially, as this step used to, means that fix cannot
      # regress-fail: deleting the chaining would leave this workflow green.
      # It costs nothing, since the chain makes packing serial anyway.
      - name: Pack game data
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)
          cmake --build build --target groups --parallel "$jobs"

      # c4group exits 0 even when packing fails, so the build reports success
      # while writing zero-byte archives. Check the output, not the exit code.
      - name: Reject empty group files
        run: |
          status=0
          for f in build/*.oc*; do
            if [ -s "$f" ]; then
              printf '  %10d  %s\n' "$(wc -c < "$f")" "$f"
            else
              echo "::error::$f is empty — packing failed silently"
              status=1
            fi
          done
          exit $status

      # C4Reloc::Init() looks for a `planet` folder next to the executable and
      # only falls back to OC_SYSTEM_DATA_DIR -- the install prefix -- if there
      # is none. That fallback is why an uninstalled out-of-source build fails
      # with "Error opening system group file (System.ocg)!" on Linux; upstream
      # never hit it because Travis built in-source, putting the binaries in the
      # repository root next to planet/. Point the engine at the packed groups
      # instead of the unpacked sources, so the scenario run exercises what
      # c4group produced. The lookup is #ifndef __APPLE__, so this is a no-op on
      # macOS, where SystemDataPath is the executable's own directory.
      - name: Stage packed game data next to the binary
        run: |
          mkdir -p build/planet
          for f in build/*.oc*; do
            ln -sf "../$(basename "$f")" "build/planet/$(basename "$f")"
          done
          ls -l build/planet

      # stdin must stay open. C4StdInProc::Execute() treats a failed read as a
      # shutdown request -- that is how the engine is meant to be stopped, and
      # what tests/start_all_scenarios.rs relies on -- but a `run:` step gets
      # stdin from /dev/null, so the read fails immediately and the engine
      # quits before the state machine reaches its first PreInit. It leaves no
      # trace beyond "Game cleared", which looks like a clean run. `tail -f`
      # holds the pipe open without ever sending anything.
      # The player file is passed by absolute path on purpose. A relative .ocp
      # argument is made absolute against the *working directory* and never goes
      # through C4Reloc (C4Application.cpp:413), so the bare "Test.ocp" this step
      # used to pass resolved to a file that has never existed in the repository.
      # A player that fails to load is not substituted -- C4ClientPlayerInfos
      # deletes the info (C4PlayerInfo.cpp:412) -- so no human player joined,
      # InitializePlayer only ran for the scenario's script player, and
      # LaunchTest(1) was never reached. The scenario reported "Game started"
      # and ran 0 of its assertions.
      # Runs all five scenarios that contain assertions, not just Movement.ocs.
      # The other 25 under Tests.ocf hold no doTest() at all, so this is the
      # whole suite: 912 executed assertions against the 7 this step used to
      # cover. See #36.
      #
      # Polls for the harness's completion line instead of sleeping a fixed 90
      # seconds. The scenarios finish in 1 to 42 seconds of engine time, so the
      # old sleep was ~25x longer than the work and the whole suite still costs
      # less than the single scenario did.
      #
      # Terminating has to be forced. Without an stdin EOF to act on, the macOS
      # build does not react to SIGTERM, and the step would hang until the job
      # timeout. The tail has to go too: it inherits the step's stdout and the
      # runner waits for that pipe to close.
      - name: Run the scenario suite
        run: |
          # Every scenario has an expected failure count, and the job fails on
          # any deviation in either direction.
          #
          # One of them is not zero: ObjectInteractionMenu.ocs fails 14 of 328
          # in the item-transfer path, cause not yet established (#51).
          #
          # Movement.ocs used to be the second one and is now pinned at zero.
          # Its test 3 expected a rock position the engine stopped producing in
          # June 2019, three months after the test was written; the expectation
          # was corrected rather than the engine (#35).
          #
          # Pinning the counts rather than merely warning about them is the
          # point. A scenario that is allowed to fail freely does not just catch
          # nothing, it *masks*: if a change takes ObjectInteractionMenu from 14
          # failures to 40, a warning-only step still goes green and only the
          # number in the message moves. The pin turns the two open bugs from
          # blind spots into tripwires without anyone having to fix them first.
          #
          # A count that drops is also a failure, deliberately. It means someone
          # fixed the underlying bug, and the pin has to come down with it or it
          # starts protecting nothing -- which is how a guard like this rots.
          # The message says so.
          # The pins and the scenario list both live in
          # tests/scenario-suite-expected.txt, read here and by the Windows job.
          # They used to be a case statement in this step and a literal in that
          # one, which is two copies of the same numbers on two platforms with
          # nothing keeping them equal.
          status=0
          pins=tests/scenario-suite-expected.txt

          # Strip comments and blank lines into a temporary file, and read the
          # loop from that file rather than from a pipe: a piped while-loop runs
          # in a subshell, and every status=1 set inside it would be discarded
          # at the closing done.
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' "$pins" > /tmp/pins.txt
          cat /tmp/pins.txt

          while read -r expected scenario; do
            log="scenario-$scenario.log"
            echo "::group::$scenario"

            tail -f /dev/null | ./build/openclonk-server --language=US \
              "$PWD/planet/Tests.ocf/$scenario.ocs" "$PWD/planet/Test.ocp" \
              > "$log" 2>&1 &
            pid=$!

            # Four different summary wordings exist across the five scenarios,
            # so match the common prefix rather than any one of them. Parsing
            # "N tests total" would find only Movement.ocs and score the other
            # four as "reported 0 tests".
            for _ in $(seq 180); do
              grep -qE "All tests have|At least one test has failed" "$log" && break
              sleep 1
            done

            kill $pid 2>/dev/null || true
            sleep 2
            kill -9 $pid 2>/dev/null || true
            pkill -f "tail -f /dev/null" 2>/dev/null || true
            wait $pid 2>/dev/null || true

            # A player that fails to load is not substituted -- C4ClientPlayerInfos
            # deletes the info (C4PlayerInfo.cpp:412) -- so InitializePlayer only
            # runs for the script player, LaunchTest(1) is never reached, and the
            # scenario reports "Game started" having executed nothing. That was
            # the state the whole suite was in until 9bbe4cde9.
            if ! grep -q "Player join: Test" "$log"; then
              echo "::error::$scenario: no player joined, so no assertion ran"
              tail -20 "$log"
              status=1
              echo "::endgroup::"
              continue
            fi
            grep -Eq "C4AulScriptEngine linked - .*, 0 warnings, 0 errors" "$log" \
              || { echo "::error::$scenario: script engine reported warnings or errors"; status=1; }

            # [Pass] and [Fail] come from the shared doTest() helper and are the
            # only uniform signal across the five scenarios.
            passed=$(grep -c "\[Pass\]" "$log" || true)
            failed=$(grep -c "\[Fail\]" "$log" || true)
            echo "$scenario: $passed passed, $failed failed"

            if [ "$passed" -eq 0 ]; then
              echo "::error::$scenario: the harness ran but executed no assertions"
              status=1
            fi

            if [ "$failed" -gt 0 ]; then
              grep -E "\[Fail\]" "$log" | head -20
            fi
            if [ "$failed" -gt "$expected" ]; then
              echo "::error::$scenario: $failed of $((passed + failed)) assertions failed, expected $expected"
              status=1
            elif [ "$failed" -lt "$expected" ]; then
              echo "::error::$scenario: $failed failures, but $expected are pinned. If this is a fix, lower the pin in $pins and close the issue it refers to."
              status=1
            elif [ "$expected" -gt 0 ]; then
              echo "$scenario: $failed known failures, unchanged"
            fi
            echo "::endgroup::"
          done < /tmp/pins.txt

          exit $status

      # Everything below this line exists so a run leaves something
      # downloadable behind, and so the release job has something to attach.
      # #23.
      #
      # Tarred before uploading rather than handed to upload-artifact as loose
      # files: the artifact format stores no Unix mode bits, so a plain upload
      # returns an openclonk-server without its executable bit. A tarball
      # inside the artifact zip survives the round trip intact.
      - name: Package the tools
        run: |
          dir="openclonk-tools-${{ matrix.platform }}"
          mkdir -p "dist/$dir"
          cp build/openclonk-server build/c4group build/c4script "dist/$dir/"
          cp COPYING TRADEMARK "dist/$dir/"
          tar czf "dist/$dir.tar.gz" -C dist "$dir"
          ls -l "dist/$dir.tar.gz"

      - name: Upload the tools
        uses: actions/upload-artifact@v4
        with:
          name: openclonk-tools-${{ matrix.platform }}
          path: dist/openclonk-tools-${{ matrix.platform }}.tar.gz
          retention-days: 14
          if-no-files-found: error

      # Packed once rather than per platform: the groups are what c4group wrote
      # out of planet/, the same bytes on every runner, and they are 79 MB.
      #
      # Music.ocg is not in OC_C4GROUPS off Apple, so it is packed here by hand.
      # Without it a client has sound effects and silence where the music
      # belongs -- on Windows with nothing in the log to say why, on Linux with
      # a "Music File not found" naming a path under SystemDataPath that no
      # amount of staging next to the binary will change. #28.
      #
      # c4group exits 0 when packing fails, so this checks the output rather
      # than the status -- the same defect the "Reject empty group files" step
      # above exists for. A Music.ocg that failed to pack is still a directory,
      # which is what the -f test catches.
      - name: Package the game data
        if: matrix.platform == 'linux-x86_64'
        run: |
          dir="openclonk-game-data"
          mkdir -p "dist/$dir"
          cp build/*.oc* "dist/$dir/"
          cp -r planet/Music.ocg "dist/$dir/Music.ocg"
          ./build/c4group "dist/$dir/Music.ocg" -p
          cp planet/COPYING "dist/$dir/COPYING"
          cp planet/AUTHORS "dist/$dir/AUTHORS"
          status=0
          for f in "dist/$dir"/*.oc*; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              printf '  %10d  %s\n' "$(wc -c < "$f")" "$(basename "$f")"
            else
              echo "::error::$(basename "$f") is empty or still a directory — packing failed silently"
              status=1
            fi
          done
          count=$(ls -1 "dist/$dir"/*.oc* | wc -l)
          if [ "$count" -ne 13 ]; then
            echo "::error::13 groups expected — 12 from OC_C4GROUPS plus Music.ocg — but $count are present"
            status=1
          fi
          tar czf "dist/$dir.tar.gz" -C dist "$dir"
          ls -l "dist/$dir.tar.gz"
          exit $status

      - name: Upload the game data
        if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: openclonk-game-data
          path: dist/openclonk-game-data.tar.gz
          retention-days: 14
          if-no-files-found: error

  # The check for the class of defect no test can catch. #41 was a stack buffer
  # read after its scope ended, in the path every `groups` build takes, and it
  # was found by reading the function -- the five C4Group tests written for the
  # same area cannot see it, because a dead stack slot returns the right bytes
  # until something else claims it.
  #
  # Nothing in this project had ever been built with -fsanitize= before. The one
  # prior use was by hand, upstream, in 2f837fc1a: "Fix two allocate-deallocate
  # mismatches. Found by ASan."
  #
  # ASan gates outright, because it reports nothing today. UBSan reports twelve
  # sites, pinned in tests/ubsan-expected.txt the way every other known-broken
  # thing here is pinned: a new site fails the job, and so does a pinned site
  # that stops being reported. #54.
  sanitizers:
    name: Sanitizers — ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpng-dev libjpeg-dev libfreetype-dev zlib1g-dev \
            libcurl4-openssl-dev libminiupnpc-dev

      - name: Fetch googletest sources
        run: |
          curl -sSL -o gtest.tar.gz \
            "https://github.com/google/googletest/archive/refs/tags/v${GTEST_VERSION}.tar.gz"
          tar xzf gtest.tar.gz

      # -fno-sanitize=vptr is not a preference. The vptr check emits references
      # to typeinfo for polymorphic types, and the `tests` binary links
      # libc4script, whose standalone host stubs C4Def out -- so the link fails
      # with "undefined reference to `typeinfo for C4Def'" before anything runs.
      - name: Configure
        run: |
          GT="$PWD/googletest-${GTEST_VERSION}"
          SAN="-fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer"
          cmake -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHEADLESS_ONLY=ON \
            -DGTEST_ROOT="$GT/googletest" -DGMOCK_ROOT="$GT/googlemock" \
            -DCMAKE_CXX_FLAGS="$SAN" -DCMAKE_C_FLAGS="$SAN" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" .

      - name: Build
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)
          cmake --build build-san --parallel "$jobs" \
            --target tests aul_test StdMeshMath determinism openclonk-server c4group

      # The unit tests, then a scenario. The scenario is what reaches the game
      # loop: the landscape sites in the pin file are reported by nothing else,
      # and #43's uninitialised reads live in that half of the codebase too.
      #
      # Leak detection stays on for the test binaries, which are leak-clean, and
      # off for the engine, which is killed rather than shut down and could not
      # report leaks meaningfully anyway.
      - name: Run everything under the sanitizers
        run: |
          status=0
          rm -f san-*.log

          for t in tests aul_test StdMeshMath determinism; do
            echo "::group::$t"
            if ! UBSAN_OPTIONS=print_stacktrace=1 "./build-san/tests/$t" > "san-$t.log" 2>&1; then
              echo "::error::$t failed under the sanitizers"
              status=1
            fi
            tail -5 "san-$t.log"
            echo "::endgroup::"
          done

          # Packing runs the sanitized c4group twelve times, and its output goes
          # into the same set of logs on purpose: AddEntryOnDisk is where #41
          # lived, and packing a directory is the path that reads the buffer
          # whose lifetime had ended. This is the closest thing to a regression
          # test that defect can have.
          echo "::group::Pack game data with a sanitized c4group"
          cmake --build build-san --target groups --parallel 1 > san-groups.log 2>&1 \
            || { echo "::error::packing failed under the sanitizers"; tail -30 san-groups.log; status=1; }
          for f in build-san/*.oc*; do
            [ -s "$f" ] || { echo "::error::$f is empty"; status=1; }
          done
          echo "::endgroup::"

          echo "::group::Movement.ocs"
          mkdir -p build-san/planet
          for f in build-san/*.oc*; do
            ln -sf "../$(basename "$f")" "build-san/planet/$(basename "$f")"
          done
          tail -f /dev/null | \
            env UBSAN_OPTIONS=print_stacktrace=1 ASAN_OPTIONS=detect_leaks=0 \
            ./build-san/openclonk-server --language=US \
            "$PWD/planet/Tests.ocf/Movement.ocs" "$PWD/planet/Test.ocp" \
            > san-scenario.log 2>&1 &
          pid=$!
          for _ in $(seq 300); do
            grep -qE "All tests have|At least one test has failed" san-scenario.log && break
            sleep 1
          done
          kill $pid 2>/dev/null || true
          sleep 2
          kill -9 $pid 2>/dev/null || true
          pkill -f "tail -f /dev/null" 2>/dev/null || true
          wait $pid 2>/dev/null || true
          grep -E "tests total|tests failed|Player join" san-scenario.log || true
          if ! grep -q "Player join: Test" san-scenario.log; then
            echo "::error::the sanitized scenario ran no assertions"
            status=1
          fi
          echo "::endgroup::"

          # ASan gates. It reports nothing today, so anything at all is new.
          if grep -h "ERROR: AddressSanitizer" san-*.log; then
            echo "::error::AddressSanitizer reported an error"
            status=1
          fi

          # UBSan is pinned by location. The messages carry operand values that
          # vary with the input, so only file:line:column is compared.
          grep -hoE "[^ ]+\.(cpp|h):[0-9]+:[0-9]+: runtime error:" san-*.log \
            | sed -e 's|.*/src/|src/|' -e 's|: runtime error:||' \
            | sort -u > ubsan-actual.txt
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' -e 's/[[:space:]]*$//' \
            tests/ubsan-expected.txt | sort -u > ubsan-expected.txt

          echo "::group::UBSan sites"
          cat ubsan-actual.txt
          echo "::endgroup::"

          if new=$(comm -23 ubsan-actual.txt ubsan-expected.txt) && [ -n "$new" ]; then
            echo "::error::undefined behaviour at a site that is not pinned:"
            echo "$new"
            grep -A 3 -F "$(echo "$new" | head -1)" san-*.log | head -20
            status=1
          fi
          if gone=$(comm -13 ubsan-actual.txt ubsan-expected.txt) && [ -n "$gone" ]; then
            echo "::error::pinned sites no longer reported. If this is a fix, remove them from tests/ubsan-expected.txt in the same commit:"
            echo "$gone"
            status=1
          fi

          exit $status

  # The only thing that loads the 69 real game scenarios -- Missions, Worlds,
  # Arena, Parkour, Defense, Tutorials. The suite above runs the five under
  # Tests.ocf that carry assertions; a script error introduced in a mission is
  # invisible to it, and was invisible to everything until this job existed.
  #
  # tests/start_all_scenarios.rs was written for exactly this in 2018 and then
  # started by nobody, so it never gated: it printed the counts it captured and
  # exited 0 whatever they were. --expect and tests/scenario-lint-expected.txt
  # are what make it a check rather than a report. #52.
  #
  # Its own job rather than a step on `headless` because it needs the planet
  # tree unpacked, and that job stages the packed groups for the scenario
  # suite. It builds openclonk-server again, which costs about six minutes of
  # wall clock in parallel with the other jobs, and skips packing entirely.
  scenario-lint:
    name: Content lint — ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpng-dev libjpeg-dev libfreetype-dev zlib1g-dev \
            libcurl4-openssl-dev libminiupnpc-dev

      - name: Build the engine
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHEADLESS_ONLY=ON .
          cmake --build build --target openclonk-server --parallel "$jobs"

      # The 2018 script carries a cargo-script header. cargo-script has been
      # unmaintained since and does not install on a current toolchain, so
      # tests/Cargo.toml states the same dependencies the ordinary way and a
      # committed Cargo.lock pins what they resolve to. The runner image ships
      # a Rust toolchain, so there is nothing to install.
      - name: Build the lint
        run: cargo build --release --manifest-path tests/Cargo.toml

      # Unpacked, and its own directory. C4Reloc::Init() looks for `planet`
      # next to the executable, so the engine gets a copy of itself with a
      # symlink beside it rather than a second staging inside build/.
      #
      # Unpacked because Experimental.ocd, Experimental.ocf, Tests.ocf and
      # Issues.ocf are deliberately not in OC_C4GROUPS -- they are development
      # content and do not ship -- and two scenarios need them. CableCars.ocs
      # wants a definition nested inside *another scenario* in Experimental.ocf,
      # so reproducing that with symlinks onto a packed tree means rebuilding
      # the source tree piece by piece. Packing changes nothing about script
      # linking: verified, the 97 scenarios that can run either way report
      # identical counts.
      - name: Stage the unpacked planet tree
        run: |
          mkdir -p lintroot
          cp build/openclonk-server lintroot/
          ln -s "$PWD/planet" lintroot/planet

      # Every scenario has a pinned warning and error count, and any deviation
      # fails -- in both directions, for the same reason the scenario suite
      # pins its failure counts. Seven of the 99 are not clean and none has
      # been diagnosed; ScriptError1.ocs is deliberate and is why "fail on any
      # error" would be the wrong rule.
      #
      # No stdin dance here: the tool opens a pipe to the engine itself and
      # closes it to shut each scenario down, which is what the `tail -f`
      # workaround in the suite above imitates.
      - name: Run the lint
        run: |
          cd lintroot
          "$GITHUB_WORKSPACE/tests/target/release/start_all_scenarios" \
            -p ../planet -e ./openclonk-server \
            -x ../tests/scenario-lint-expected.txt

  # The first job to build a client anywhere. Everything above builds
  # openclonk-server; C4Window, C4DrawGL, the startup dialogs, src/editor/ and
  # src/mape/ were compiled by nothing in CI until this existed.
  #
  # Linux is the only platform where all three can be built at once: Qt5 is gone
  # from Homebrew (so no editor on macOS) and mape needs GTK3 (so it exists on
  # neither macOS nor Windows). Both were verified by hand on the Arch machine
  # first -- see fork-notes/platforms.md -- this makes them regression-tested.
  #
  # It does not launch anything. That needs xvfb, and is #45; the engine is
  # known to run on llvmpipe, so the display is not the obstacle it was assumed
  # to be for a long time.
  linux-client:
    name: Client, editor and mape — ubuntu-latest, Qt${{ matrix.qt }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Both major versions, because both are supported and each is the only one
    # available somewhere: Windows gets Qt5 from vcpkg, and macOS has no Qt5
    # from Homebrew at all, which is what the Qt6 support exists for (#46, #50).
    # A version nothing builds is a version nobody knows about.
    #
    # Neither leg forces a choice. Each installs only the Qt it is testing, so
    # find_package(QT NAMES Qt6 Qt5) picks it the way it would on a machine that
    # has exactly one of them -- which is the situation being covered.
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]

    steps:
      - uses: actions/checkout@v5

      - name: Record the platform
        run: |
          uname -sm
          cmake --version | head -1
          gcc --version | head -1

      # On top of the headless set: a GL loader and SDL2 for the client, the
      # four audio components FindAudio insists on together, GTK3 with
      # gtksourceview for mape, and qtbase5-dev for the editor.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpng-dev libjpeg-dev libfreetype-dev zlib1g-dev \
            libcurl4-openssl-dev libminiupnpc-dev \
            libepoxy-dev libsdl2-dev libglu1-mesa-dev libx11-dev \
            libopenal-dev libalut-dev libogg-dev libvorbis-dev \
            libgtk-3-dev libgtksourceview-3.0-dev

      # Only the version under test, so nothing has to force the choice and the
      # configure output can be asserted on rather than trusted.
      - name: Install Qt${{ matrix.qt }}
        run: |
          if [ "${{ matrix.qt }}" = "6" ]; then
            sudo apt-get install -y --no-install-recommends qt6-base-dev
          else
            sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools
          fi

      - name: Configure
        run: |
          cmake -B build-client -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHEADLESS_ONLY=OFF . | tee configure.log

      # Each of the three is auto-enabled by a find_package that is allowed to
      # fail quietly, so a missing package does not fail the build -- it removes
      # the target, and the job would go green having compiled nothing new. All
      # three failure modes have happened on a developer machine already.
      # Written with `if` rather than `grep && { ... }`: these steps run under
      # `bash -e`, where the exit status of a && list is the status of whatever
      # ran last, and a guard whose grep is *supposed* to find nothing then
      # reads as a failing command. `if` says what is meant and cannot misfire.
      - name: Assert the optional pieces were actually enabled
        run: |
          status=0
          # Assert the *version*, not merely that some Qt was found. A leg that
          # quietly tested the other one would be worse than no leg at all.
          if ! grep -q "Using Qt${{ matrix.qt }} for the editor" configure.log; then
            echo "::error::configure did not report Qt${{ matrix.qt }}: src/editor/ is absent or built against the wrong version"
            grep -i "qt" configure.log || true
            status=1
          fi
          if grep -q "Not enabling audio output" configure.log; then
            echo "::error::FindAudio found no complete set, so the client is silent"
            status=1
          fi
          if ! grep -qE "^Qt${{ matrix.qt }}Widgets_DIR:" build-client/CMakeCache.txt; then
            echo "::error::Qt${{ matrix.qt }}Widgets_DIR is not in the cache"
            status=1
          fi
          exit $status

      - name: Build
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)
          cmake --build build-client --parallel "$jobs"

      # mape is EXCLUDE_FROM_ALL in effect -- it only exists when GTK3 and
      # gtksourceview are both found -- so name it, and let the build fail
      # loudly if the target is absent rather than silently skipping it.
      - name: Build mape
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)
          cmake --build build-client --target mape --parallel "$jobs"

      # The editor sources are added to OC_GUI_SOURCES rather than to a target
      # of their own, so "openclonk linked" does not prove they were compiled.
      # Check for the objects.
      - name: Assert the editor sources were compiled
        run: |
          dir=build-client/CMakeFiles/openclonk.dir/src/editor
          count=$(find "$dir" -name "*.o" 2>/dev/null | wc -l)
          echo "$count editor objects"
          [ "$count" -ge 15 ] \
            || { echo "::error::only $count objects in $dir -- src/editor/ was not built"; exit 1; }
          ldd build-client/openclonk | grep -E "libQt${{ matrix.qt }}(Core|Gui|Widgets)" \
            || { echo "::error::openclonk does not link Qt${{ matrix.qt }}"; exit 1; }

      - name: Assert the client links what a client needs
        run: |
          for lib in libepoxy libSDL2 libopenal libalut libvorbisfile; do
            ldd build-client/openclonk | grep -q "$lib" \
              || { echo "::error::openclonk does not link $lib"; exit 1; }
          done
          echo "GL loader, SDL2 and the full audio set are linked"

      # The first job to *start* the engine anywhere. Everything else compiles a
      # client and inspects the result: macos-app builds a bundle and never
      # launches it, and until now "no display on the runner" was treated as a
      # hard limit here too. It is not one -- xvfb is a package, and the engine
      # runs on llvmpipe at GL 4.6 Core, so software rasterisation is enough to
      # reach the menu. #45.
      #
      # This covers what compiling cannot: that a GL context is actually
      # created, that C4Window and the SDL main loop work, and that
      # C4StartupMainDlg gets as far as drawing itself.
      - name: Install a virtual X server
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Pack and stage game data for the client
        run: |
          cmake --build build-client --target groups --parallel 1
          mkdir -p build-client/planet
          for f in build-client/*.oc*; do
            ln -sf "../$(basename "$f")" "build-client/planet/$(basename "$f")"
          done

      # A throwaway config, so nothing depends on a runner's home directory and
      # nothing is left behind in it.
      #
      # The player file is the point of the UserDataPath, not decoration.
      # C4StartupMainDlg::OnShown scans that directory for *.ocp and opens a
      # modal "create a player" dialog when it finds none -- which is the path
      # #37 crashes in, roughly one launch in six. Gating on it would make this
      # job flaky for a defect it cannot fix, so the gate takes the stable path
      # and the step after this one hunts the crash without gating.
      #
      # Windowed=1 keeps the engine from asking Xvfb for a mode switch.
      - name: Write a throwaway configuration
        run: |
          mkdir -p ci-userdata
          # -r because planet/Test.ocp is an unpacked player, i.e. a directory.
          # C4StartupMainDlg matches *.ocp by name and does not care which it is.
          cp -r planet/Test.ocp ci-userdata/
          cat > ci.config <<EOF
          [General]
          UserDataPath="$PWD/ci-userdata/"
          FirstStart=false

          [Graphics]
          Windowed=1
          WindowX=1024
          WindowY=768
          EOF
          cat ci.config
          # Note for anyone debugging this later: the engine rewrites the file
          # it was given on exit, with its whole configuration rather than the
          # keys it was handed. Harmless here, confusing if you look at the file
          # afterwards and wonder where your three lines went.

      # The engine exits 2 on an aborted round (C4XRV_Aborted) and this kills
      # it rather than closing it, so the exit status says nothing useful. The
      # log is the signal.
      - name: Start the engine and reach the menu
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build-client/openclonk --language=US --config="$PWD/ci.config" > gui.log 2>&1 &
          pid=$!

          # Under llvmpipe the startup takes seconds rather than milliseconds.
          for _ in $(seq 60); do
            grep -qE "^\[[0-9:]+\] GL [0-9]" gui.log && break
            sleep 1
          done
          sleep 5
          alive=0
          kill -0 $pid 2>/dev/null && alive=1
          kill $pid 2>/dev/null || true
          sleep 2
          kill -9 $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true

          echo "::group::engine log"
          cat gui.log
          echo "::endgroup::"

          status=0
          grep -qE "^\[[0-9:]+\] GL [0-9]" gui.log \
            || { echo "::error::no GL context was created"; status=1; }
          # "Loading graphics..." is IDS_PRC_GFXRES from the string table, so it
          # is only this text because the launch passes --language=US, the way
          # every other job here does. The GL line above is a literal in
          # C4DrawGL.cpp and needs no such care.
          grep -q "Loading graphics" gui.log \
            || { echo "::error::the engine did not get as far as loading graphics"; status=1; }
          # The player file copied in above is the fixture for this step: with
          # it, C4StartupMainDlg::OnShown skips the modal dialog that #37
          # crashes in, which is why this step can gate at all. Since #58 the
          # branch says so in the log, so assert it rather than assume it -- a
          # directory that stopped counting as "has a player" would otherwise
          # move this step onto the flaky path without changing a line of output.
          #
          # LogSilent goes to the log file and not to stdout, so this looks at
          # the engine's own log rather than at gui.log.
          grep -h "skipping player creation" ci-userdata/OpenClonk*.log \
            || { echo "::error::the engine did not find the player file, so this step ran the first-run path it is meant to avoid"; status=1; }
          if [ "$alive" -eq 0 ]; then
            echo "::error::the engine exited before it could be stopped"
            status=1
          fi
          if grep -qE "Segmentation fault|FATAL ERROR" gui.log; then
            echo "::error::the engine crashed on startup"
            status=1
          fi
          exit $status

      # Not gating on the crash. #37 is an intermittent segfault in the modal
      # player-creation dialog, seen once in six launches by hand and never
      # reproduced in CI. The path is reached only when the user directory holds
      # no player file, so this starts the engine five times against an empty
      # one and counts the crashes.
      #
      # A crash here is a *finding*, not a build failure -- it is evidence for a
      # bug that has none, gathered on every push for about a minute.
      #
      # The fixture does gate, though, which is what #58 bought: both branches
      # of C4StartupMainDlg::OnShown now log which one they took, so five
      # launches of the ordinary menu can no longer report themselves as five
      # clean first-run launches. A broken test is a build failure; a
      # reproduced bug is a finding.
      - name: Hunt the first-run crash (#37, gating on the fixture only)
        run: |
          crashes=0
          shown=0
          status=0
          for i in $(seq 5); do
            rm -rf firstrun-userdata
            mkdir -p firstrun-userdata

            # Belt and braces: the log lines below say which branch the engine
            # took, and this says the directory was empty to begin with. The
            # second is cheaper to read when it fails.
            if [ -n "$(find firstrun-userdata -maxdepth 1 -name '*.ocp' -print -quit)" ]; then
              echo "::error::firstrun-userdata is not empty, so this is not the first-run path"
              exit 1
            fi
            cat > firstrun.config <<EOF
          [General]
          UserDataPath="$PWD/firstrun-userdata/"

          [Graphics]
          Windowed=1
          WindowX=1024
          WindowY=768
          EOF
            xvfb-run -a --server-args="-screen 0 1024x768x24" \
              env LIBGL_ALWAYS_SOFTWARE=1 \
              ./build-client/openclonk --language=US --config="$PWD/firstrun.config" > "firstrun-$i.log" 2>&1 &
            pid=$!
            for _ in $(seq 40); do
              grep -qE "^\[[0-9:]+\] GL [0-9]" "firstrun-$i.log" && break
              sleep 1
            done
            sleep 4

            # Liveness alone under-reports the crash. backward-cpp symbolises
            # every frame with source context before it re-raises, which takes
            # seconds on a binary this size -- long enough that a crashed engine
            # is often still running when we look. The trace it writes is the
            # reliable signal; the liveness check stays for a death that leaves
            # no trace at all.
            crashed=no
            kill -0 $pid 2>/dev/null || crashed=yes
            grep -qE "Stack trace|Caught signal|Segmentation fault" \
              "firstrun-$i.log" firstrun-userdata/OpenClonk*.log 2>/dev/null && crashed=yes
            kill -9 $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true

            if [ "$crashed" = yes ]; then
              echo "::warning::run $i: the engine crashed -- possible #37"
              tail -40 "firstrun-$i.log"
              crashes=$((crashes + 1))
            fi

            # Which path the engine actually took (#58).
            if grep -qh "opening player creation" firstrun-userdata/OpenClonk*.log 2>/dev/null; then
              shown=$((shown + 1))
            elif grep -qh "skipping player creation" firstrun-userdata/OpenClonk*.log 2>/dev/null; then
              echo "::error::run $i: the engine found a player file in a directory we emptied, so this launch exercised the ordinary menu"
              status=1
            elif [ "$crashed" = yes ]; then
              echo "::warning::run $i: the engine crashed before it reached the player check"
            else
              echo "::error::run $i: the engine never reached C4StartupMainDlg::OnShown"
              status=1
            fi
          done
          echo "$shown of 5 first-run launches opened the player creation dialog"
          echo "$crashes of 5 first-run launches crashed"
          if [ "$shown" -eq 0 ]; then
            echo "::error::no launch reached the dialog, so this step hunted nothing"
            status=1
          fi
          exit $status

      # The client this job just started, with the editor compiled into it, and
      # mape. Not an install: the game data is a separate artifact, and music
      # stays silent in a build tree whatever you put next to the binary,
      # because C4MusicSystem looks under SystemDataPath (#28). The release
      # notes say so; a downloader who only has the tarball would not know.
      #
      # mape is located rather than assumed: oc_set_target_names() redirects the
      # four shipped executables to the build root and mape is not one of them.
      - name: Package the client
        run: |
          dir="openclonk-client-linux-x86_64-qt${{ matrix.qt }}"
          mkdir -p "dist/$dir"
          mape=$(find build-client -maxdepth 2 -type f -name mape -perm -u+x | head -1)
          [ -n "$mape" ] || { echo "::error::mape was built but cannot be found"; exit 1; }
          cp build-client/openclonk "$mape" "dist/$dir/"
          cp COPYING TRADEMARK "dist/$dir/"
          tar czf "dist/$dir.tar.gz" -C dist "$dir"
          ls -l "dist/$dir.tar.gz"

      - name: Upload the client
        uses: actions/upload-artifact@v4
        with:
          name: openclonk-client-linux-x86_64-qt${{ matrix.qt }}
          path: dist/openclonk-client-linux-x86_64-qt${{ matrix.qt }}.tar.gz
          retention-days: 14
          if-no-files-found: error


  macos-app:
    name: App bundle — macos-latest
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        # aws/tap ships with the runner image and is untrusted, which makes
        # Homebrew print a warning three times per job. We only ever install
        # from homebrew/core, so drop it rather than let a warning that never
        # matters train everyone to skip warnings. Tolerant of it being absent:
        # the steps run under `bash -e` and untapping something that is not
        # there is an error.
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install libepoxy openal-soft freealut sdl2 \
            libpng jpeg-turbo freetype libogg libvorbis miniupnpc

      # openal-soft is keg-only. Without the prefix hint FindAudio falls back to
      # Apple's deprecated OpenAL.framework, which has no EFX.
      - name: Configure
        run: |
          cmake -B build-gui -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHEADLESS_ONLY=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix openal-soft)" . | tee configure.log
          grep -q "Using Audio toolkit: OpenAL" configure.log \
            || { echo "::error::no real OpenAL was selected"; exit 1; }

      - name: Build
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)
          cmake --build build-gui --parallel "$jobs"

      # install_name_tool invalidates signatures, and on arm64 an invalid
      # signature is fatal: the kernel refuses to map the image. The bundled
      # libraries must verify.
      - name: Verify bundled libraries are signed
        run: |
          status=0
          for f in build-gui/openclonk.app/Contents/Frameworks/*.dylib; do
            if codesign -v "$f" 2>/dev/null; then
              echo "  ok  $(basename "$f")"
            else
              echo "::error::$(basename "$f") has no valid signature"
              status=1
            fi
          done
          exit $status

      # The whole bundle must verify, resource seal included. That only works
      # because signing happens after the game data is packed in; if the order
      # regresses this is the check that catches it.
      - name: Verify the bundle verifies
        run: |
          codesign -v build-gui/openclonk.app \
            || { echo "::error::the app bundle does not verify"; exit 1; }
          echo "bundle signature and resource seal are valid"

      - name: Verify the executable is fully linked
        run: |
          exe=build-gui/openclonk.app/Contents/MacOS/openclonk
          file "$exe"
          missing=0
          # Feed the loop by redirection, not through a pipe: a piped while
          # runs in a subshell and its assignment to $missing would be lost.
          while read -r lib; do
            path="${lib/@executable_path/$(dirname "$exe")}"
            if [ -f "$path" ]; then
              echo "  ok  $lib"
            else
              echo "::error::unresolved dependency: $lib"
              missing=1
            fi
          done < <(otool -L "$exe" | tail -n +2 | awk '{print $1}' \
                     | grep -v '^/System\|^/usr/lib')
          exit $missing

      # ditto, not zip. The bundle is ad-hoc signed and install_name_tool has
      # already rewritten every library in it; an archiver that drops symlinks
      # or extended attributes invalidates the signature the two steps above
      # just verified, and on arm64 an invalid signature is fatal rather than
      # cosmetic. Unpacked and re-verified here, because a bundle that only
      # fails to verify on the downloader's machine is worse than none.
      #
      # Still not distributable, for reasons that have nothing to do with the
      # archive: the rpaths tools/osx_bundle_libs writes are absolute paths on
      # the machine that built it, and ad-hoc is not a Developer ID. #24.
      - name: Package the app bundle
        run: |
          mkdir -p dist
          ditto -c -k --keepParent --sequesterRsrc build-gui/openclonk.app \
            dist/openclonk-app-macos-arm64.zip
          rm -rf verify && mkdir -p verify
          ditto -x -k dist/openclonk-app-macos-arm64.zip verify
          codesign -v verify/openclonk.app \
            || { echo "::error::the bundle does not verify after the archive round trip"; exit 1; }
          echo "bundle still verifies unpacked"
          ls -l dist/openclonk-app-macos-arm64.zip

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: openclonk-app-macos-arm64
          path: dist/openclonk-app-macos-arm64.zip
          retention-days: 14
          if-no-files-found: error

  # Windows has had no CI since AppVeyor. The old setup pulled prebuilt
  # dependencies from a personal server that is now unreachable, so this starts
  # from the smallest useful target instead: C4GROUP_TOOL_ONLY needs nothing but
  # zlib, and it still compiles all of libmisc -- C4Group, CStdFile,
  # StdCompiler, C4NetIO and the vendored zlib fork -- which is where this
  # fork's cross-platform changes live.
  windows-c4group:
    name: c4group only — windows-latest
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Install zlib
        run: vcpkg install zlib:x64-windows

      - name: Configure
        run: >
          cmake -B build -A x64 -DC4GROUP_TOOL_ONLY=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows .

      # Only the c4group target: C4GROUP_TOOL_ONLY still *defines* libc4script
      # and libopenclonk, so the default `all` target tries to compile sources
      # needing PNG and JPEG, which that configuration deliberately does not
      # look for.
      - name: Build
        run: cmake --build build --config RelWithDebInfo --target c4group --parallel

      # Exercises the group format end to end, and with it the exit code fix:
      # c4group used to return 0 even after "Pack failed".
      - name: Round-trip a group
      #
      # The binary is located rather than assumed: oc_set_target_names() sets
      # RUNTIME_OUTPUT_DIRECTORY per configuration to the build root, so the
      # file is build/c4group.exe, not the build/<Config>/ layout MSVC uses by
      # default, and other configurations get a suffixed name.
        run: |
          New-Item -ItemType Directory -Force src-dir | Out-Null
          Set-Content src-dir/a.txt "hello"
          Set-Content src-dir/b.txt "world"
          $exe = Get-ChildItem -Path build -Recurse -Filter "c4group*.exe" |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "no c4group executable was produced" }
          Write-Host "using $exe"
          echo "C4GROUP=$exe" >> $env:GITHUB_ENV
          & $exe src-dir -t out.ocg
          if ($LASTEXITCODE -ne 0) { throw "pack reported failure" }
          if ((Get-Item out.ocg).Length -eq 0) { throw "pack produced an empty archive" }
          New-Item -ItemType Directory -Force unpacked | Out-Null
          Copy-Item out.ocg unpacked/
          Push-Location unpacked
          & $exe out.ocg -u
          if ($LASTEXITCODE -ne 0) { throw "unpack reported failure" }
          if ((Get-Content out.ocg/a.txt) -ne "hello") { throw "round-trip lost content" }
          Pop-Location
          Write-Host "pack/unpack round-trip ok"

      # A failing operation must be visible in the exit code here too.
      #
      # Naming a nonexistent group is not a failure: ProcessGroup() opens with
      # do_create set, so c4group creates it and legitimately succeeds. Use a
      # usage error instead, which has no filesystem semantics to get wrong.
      - name: A failed operation must not report success
        run: |
          & $env:C4GROUP src-dir -t 2>$null
          if ($LASTEXITCODE -eq 0) { throw "c4group reported success for a failed pack" }
          Write-Host "failure is reported in the exit code ($LASTEXITCODE)"
          # The step's own status comes from $LASTEXITCODE, which is still the
          # non-zero code we just asserted on. Reset it, or the step fails for
          # having successfully verified a failure.
          exit 0

  # The largest coverage gap this workflow had, and the one that got larger the
  # day the project moved to C++17: the job above builds only `c4group`, which
  # links `libmisc` and nothing else, so MSVC had compiled the archive layer and
  # not `libc4script`, `libopenclonk` or the engine. This job compiles all of
  # them, runs the unit tests, packs the game data and starts a scenario.
  #
  # Kept separate from `windows-c4group` rather than folded into it. They are
  # different configurations -- C4GROUP_TOOL_ONLY still defines libraries it
  # never looks for dependencies for (#19), which is exactly what that job
  # guards -- and as two jobs they run in parallel instead of in sequence.
  #
  # Everything here was verified by hand on a Windows 11 machine first, and the
  # engine needed no source change for any of it. See #20 and #30, and
  # fork-notes/platforms.md for the full account.
  windows-headless:
    name: Headless — windows-latest
    runs-on: windows-latest
    # Higher than the 45 the other jobs use. vcpkg builds its ports from source
    # on a cache miss, which took 38 minutes on the development machine, and
    # roughly 500 translation units follow it.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      # vcpkg's default binary cache. A miss rebuilds four ports from source and
      # dominates the job; a hit turns the install step into an unpack. The key
      # names the package set rather than hashing a file, so editing anything
      # else in this workflow does not throw the cache away -- change the list,
      # change the suffix.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-x64-windows-zlib-libpng-jpegturbo-curl-v1

      # The four packages HEADLESS_ONLY actually requires. Freetype and epoxy
      # are excluded by the option itself; SDL2 is REQUIRED only under
      # USE_SDL_MAINLOOP, which loses to USE_WIN32_WINDOWS on this platform.
      - name: Install dependencies
        run: >
          vcpkg install zlib:x64-windows libpng:x64-windows
          libjpeg-turbo:x64-windows curl:x64-windows

      # Same version and the same reasoning as the Unix jobs, but fetched as a
      # zip and unpacked with Expand-Archive: Git's tar ships ahead of the
      # system one on PATH here and treats an argument containing a drive letter
      # as a remote host.
      - name: Fetch googletest sources
        run: |
          curl.exe -sSL -o gtest.zip `
            "https://github.com/google/googletest/archive/refs/tags/v$env:GTEST_VERSION.zip"
          Expand-Archive -Path gtest.zip -DestinationPath . -Force

      - name: Configure
        run: |
          $gt = "$pwd/googletest-$env:GTEST_VERSION"
          cmake -B build -A x64 -DHEADLESS_ONLY=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DGTEST_ROOT="$gt/googletest" -DGMOCK_ROOT="$gt/googlemock" . |
            Tee-Object -FilePath configure.log
          if (Select-String -Path configure.log -Pattern "Could NOT find GTest" -Quiet) {
            throw "googletest sources were not picked up"
          }

      # No --parallel: the MSVC branch of CMakeLists.txt already puts /MP on
      # CMAKE_CXX_FLAGS, so MSBuild is parallel per project and adding job-level
      # parallelism oversubscribes the runner.
      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Build test targets
        run: >
          cmake --build build --config RelWithDebInfo
          --target tests aul_test StdMeshMath determinism

      # ctest needs -C on a multi-config generator, and the manifest lives in
      # build/tests because enable_testing() is called from tests/CMakeLists.txt
      # rather than the top level. Assert all four binaries are registered
      # first: a target added without add_test() drops out of the run silently.
      #
      # Expect 74 rather than the 72 the Unix jobs see. `tests` runs 17 cases
      # here because UnicodeHandlingTest has two registry cases that only exist
      # on Windows. The count is not asserted -- the suites are -- but a sudden
      # 72 here would be worth looking at.
      - name: Unit tests
        run: |
          $listing = ctest --test-dir build/tests -C RelWithDebInfo -N
          $listing
          foreach ($t in "tests", "aul_test", "StdMeshMath", "determinism") {
            if (-not ($listing | Select-String -Pattern ('Test\s+#\d+:\s+' + $t + '$') -Quiet)) {
              throw "$t is not registered with ctest"
            }
          }
          ctest --test-dir build/tests -C RelWithDebInfo --output-on-failure

      # Packing on this generator was impossible until b0ce04384: CMake
      # relativises a custom command against the build directory, so MSBuild
      # invoked a c4group path that does not exist and failed with MSB8066 code
      # 9009 before a single group was written. #29.
      - name: Pack game data
        run: cmake --build build --config RelWithDebInfo --target groups

      # c4group exits 0 even when packing fails, so the build reports success
      # while writing zero-byte archives. Check the output, not the exit code.
      - name: Reject empty group files
        run: |
          $bad = $false
          Get-ChildItem build\* -Include *.ocf,*.ocg,*.ocd,*.ocm | ForEach-Object {
            "{0,10}  {1}" -f $_.Length, $_.Name
            if ($_.Length -eq 0) {
              Write-Host "::error::$($_.Name) is empty — packing failed silently"
              $bad = $true
            }
          }
          if ($bad) { exit 1 }

      # Hardlinks rather than symlinks: creating a symlink needs a privilege the
      # runner does not have, and a hardlink stages the groups just as well.
      # The engine looks for `planet` next to the executable, and
      # oc_set_target_names() puts openclonk-server.exe in the build root rather
      # than build/<Config>/.
      - name: Stage packed game data next to the binary
        run: |
          New-Item -ItemType Directory -Force build\planet | Out-Null
          Get-ChildItem build\* -Include *.ocf,*.ocg,*.ocd,*.ocm | ForEach-Object {
            New-Item -ItemType HardLink -Path "build\planet\$($_.Name)" -Target $_.FullName -Force | Out-Null
          }
          Get-ChildItem build\planet | Select-Object Name, Length

      # No stdin dance, and none available: STDSCHEDULER_USE_EVENTS is defined
      # on Windows, so C4AbstractApp never registers C4StdInProc and the engine
      # cannot be stopped by closing stdin (C4AppT.cpp:34 says so outright).
      # The process has to be killed, which is why this polls a log rather than
      # waiting for the process to exit.
      #
      # The player file is passed by absolute path. A relative .ocp argument is
      # made absolute against the working directory and never consults C4Reloc,
      # so a bare Test.ocp resolves to nothing and no player joins -- and a
      # player that fails to load is not substituted, so the scenario reports
      # "Game started" having run no assertions at all (#27).
      #
      # Same five scenarios and the same pinned counts as the Unix jobs, from
      # the same file. This used to run Movement.ocs alone against a literal
      # zero, which meant Windows checked 6 assertions where Linux checked 912,
      # and nothing made that visible.
      - name: Run the scenario suite
        run: |
          $exe = "build\openclonk-server.exe"
          if (-not (Test-Path $exe)) { throw "no openclonk-server.exe was produced" }

          $pins = "tests\scenario-suite-expected.txt"
          $status = 0
          $done = "All tests have|At least one test has failed"
          $appdata = Join-Path $env:APPDATA "OpenClonk\OpenClonk.log"

          foreach ($line in Get-Content $pins) {
            $line = ($line -replace '#.*', '').Trim()
            if (-not $line) { continue }
            $expected, $scenario = $line -split '\s+', 2
            $expected = [int]$expected
            $scenario = $scenario.Trim()
            Write-Host "::group::$scenario"

            $log = "scenario-$scenario.log"
            Remove-Item $appdata -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -PassThru -NoNewWindow `
              -ArgumentList "--language=US", "$pwd\planet\Tests.ocf\$scenario.ocs", "$pwd\planet\Test.ocp" `
              -RedirectStandardOutput $log

            # The engine writes %APPDATA%\OpenClonk\OpenClonk.log whatever else
            # it does, so poll both and keep whichever carries the harness
            # output. ObjectInteractionMenu is the slow one at about 40 seconds.
            $read = $log
            for ($i = 0; $i -lt 180; $i++) {
              foreach ($f in $log, $appdata) {
                if ((Test-Path $f) -and (Select-String -Path $f -Pattern $done -Quiet)) { $read = $f }
              }
              if ((Test-Path $read) -and (Select-String -Path $read -Pattern $done -Quiet)) { break }
              Start-Sleep -Seconds 1
            }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 500

            if (-not (Select-String -Path $read -Pattern "Player join: Test" -Quiet)) {
              Write-Host "::error::${scenario}: no player joined, so no assertion ran"
              Get-Content $read -Tail 20
              $status = 1
              Write-Host "::endgroup::"
              continue
            }
            if (-not (Select-String -Path $read -Pattern "C4AulScriptEngine linked - .*, 0 warnings, 0 errors" -Quiet)) {
              Write-Host "::error::${scenario}: script engine reported warnings or errors"
              $status = 1
            }

            $passed = @(Select-String -Path $read -Pattern "\[Pass\]").Count
            $failed = @(Select-String -Path $read -Pattern "\[Fail\]").Count
            Write-Host "${scenario}: $passed passed, $failed failed"

            if ($passed -eq 0) {
              Write-Host "::error::${scenario}: the harness ran but executed no assertions"
              $status = 1
            }
            if ($failed -gt 0) {
              Select-String -Path $read -Pattern "\[Fail\]" | Select-Object -First 20 |
                ForEach-Object { $_.Line }
            }
            if ($failed -gt $expected) {
              Write-Host "::error::${scenario}: $failed of $($passed + $failed) assertions failed, expected $expected"
              $status = 1
            } elseif ($failed -lt $expected) {
              Write-Host "::error::${scenario}: $failed failures, but $expected are pinned. If this is a fix, lower the pin in $pins and close the issue it refers to."
              $status = 1
            } elseif ($expected -gt 0) {
              Write-Host "${scenario}: $failed known failures, unchanged"
            }
            Write-Host "::endgroup::"
          }

          exit $status

      # The Windows half of #23. Zipped with Compress-Archive rather than tarred
      # like the Unix jobs: there is no mode bit to preserve here, and a zip is
      # what a Windows downloader can open without installing anything.
      #
      # The DLLs are not optional. vcpkg's applocal deployment puts them next to
      # the executables at link time, and without them the tools fail to start
      # with a dialog box rather than a message on stdout -- which is exactly
      # how #31 hid. The scenario suite above ran openclonk-server.exe out of
      # this directory, so whatever it needed is here.
      - name: Package the tools
        run: |
          $dir = "dist\openclonk-tools-windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($exe in "openclonk-server.exe", "c4group.exe", "c4script.exe") {
            if (-not (Test-Path "build\$exe")) { throw "no $exe was produced" }
            Copy-Item "build\$exe" $dir
          }
          $dlls = Get-ChildItem build -Recurse -Depth 1 -Filter *.dll |
            Group-Object Name | ForEach-Object { $_.Group[0] }
          if (-not $dlls) { throw "no dependency DLLs next to the executables" }
          $dlls | ForEach-Object { Copy-Item $_.FullName $dir }
          Write-Host "$($dlls.Count) DLLs bundled"
          Copy-Item COPYING, TRADEMARK $dir
          Compress-Archive -Path "$dir\*" `
            -DestinationPath "dist\openclonk-tools-windows-x64.zip" -Force
          Get-Item "dist\openclonk-tools-windows-x64.zip" | Select-Object Name, Length

      - name: Upload the tools
        uses: actions/upload-artifact@v4
        with:
          name: openclonk-tools-windows-x64
          path: dist/openclonk-tools-windows-x64.zip
          retention-days: 14
          if-no-files-found: error

  # Cutting a release is an ordinary green run plus one job that collects what
  # the others already built. It runs only for a `v*` tag, and it needs every
  # other job: a release that skipped the sanitizers or the content lint would
  # be a release nobody checked. #23.
  #
  # Nothing is built here. If the assets are wrong, they were wrong in CI, which
  # is where that gets noticed rather than after publishing.
  release:
    name: Release — ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - headless
      - sanitizers
      - scenario-lint
      - linux-client
      - macos-app
      - windows-c4group
      - windows-headless
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The jobs that build the archives run on every push and have no tag to
      # name themselves after, so the version goes in here:
      # openclonk-tools-linux-x86_64.tar.gz becomes
      # openclonk-9.0-alpha-fork.1-tools-linux-x86_64.tar.gz.
      #
      # The count is asserted because a job that produced no artifact does not
      # fail this one -- download-artifact is happy with whatever it finds, and
      # a release missing a platform looks exactly like a release that never
      # had one.
      - name: Collect the assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          found=0
          while read -r f; do
            base=$(basename "$f")
            mv "$f" "dist/${base/openclonk-/openclonk-$version-}"
            found=$((found + 1))
          done < <(find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \))
          ls -l dist
          if [ "$found" -ne 7 ]; then
            echo "::error::$found assets collected, 7 expected — two tool sets on Unix, one on Windows, two clients, the app bundle and the game data"
            exit 1
          fi

      # Written notes when the tag has a file, generated ones otherwise, and a
      # warning either way if it is the fallback: the commit messages in this
      # fork carry their reasoning, so --generate-notes produces something
      # readable, but it cannot say what a release is for.
      #
      # Re-runnable. `gh release create` fails on an existing release, which
      # would turn a re-run of a flaky job into a red run over a release that
      # is already published.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="fork-notes/releases/${GITHUB_REF_NAME}.md"
          args=(--verify-tag --title "$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *alpha*|*beta*|*rc*) args+=(--prerelease) ;;
          esac
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            echo "::warning::no $notes — publishing generated notes instead"
            args+=(--generate-notes)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "the release exists — replacing its assets"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*
          fi
          gh release view "$GITHUB_REF_NAME" --json name,isPrerelease,assets \
            --jq '.name, .isPrerelease, (.assets[] | "  \(.size)  \(.name)")'
